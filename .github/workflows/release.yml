name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      # NOTE: '*.md' only matches root-level files (README.md, SPEC.md), so
      # .changeset/*.md still triggers this workflow — changesets must, for
      # version PRs to be created.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Mint a short-lived installation token from the enbox-release-bot App
      # (installed org-wide). We cannot use the default `GITHUB_TOKEN` because
      # pushes/PRs made with it do not trigger downstream workflows (recursion
      # prevention), so the version PR would never receive its CI checks. The
      # App acts as a distinct identity, so its commits/PR updates trigger
      # `ci.yml` normally. Same App and secret names as enboxorg/enbox.
      # Actions are pinned to commit SHAs (version tags are mutable refs).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Persist App credentials so pushes performed by the version/publish
          # scripts use the App identity, not `github-actions[bot]`.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22 (active LTS): Node 20 reached EOL 2026-04, and the
          # changesets CLI needs require(esm) (Node >= 20.19 / 22.12).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Single-package repo with no workspace:* protocol, so plain
          # `changeset publish` works (it publishes via npm, which reads auth
          # from the .npmrc that setup-node wrote). The monorepo's publish.sh
          # workaround is deliberately NOT needed here.
          publish: bun run release
          # `changeset version` then `bun install` so the lockfile picks up the
          # new version and the version PR passes `--frozen-lockfile` CI.
          version: bun run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # App token (not GITHUB_TOKEN) so the version PR's commits trigger
          # ci.yml and produce its checks.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
